<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Library.</h1>
        
        <div class="form-group">
            <div class="input-row">
                <input type="text" id="title" placeholder="Title" required>
                <input type="text" id="author" placeholder="Author" required>
            </div>
            <div class="input-row">
                <select id="status">
                    <option value="To Read">To Read</option>
                    <option value="Reading">Reading</option>
                    <option value="Completed">Completed</option>
                </select>
                <input type="number" id="totalPages" placeholder="Total Pages (e.g. 350)" min="1">
            </div>
            <textarea id="notes" placeholder="Reflections or notes..."></textarea>
            <button class="add-btn" onclick="addBook()">Add to Library</button>
        </div>

        <ul id="book-list" class="book-list"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
